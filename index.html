<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9d44d" />
    <!--
      Aperçu du lien quand on partage Armana (WhatsApp, Messenger, SMS…).
      Sans ces balises, le partage n'affichait qu'une adresse nue.
      ⚠ La description est reprise à l'identique dans manifest.webmanifest et
      dans src/lib/share.js : les trois changent ensemble.
      ⚠ og:url et og:image DOIVENT être absolus — un chemin relatif n'est pas
      résolu par les robots. Ce sont donc deux adresses de plus à reprendre le
      jour où le nom de domaine change (voir aussi share.js, viewInstall.js et
      la fonction notify).
    -->
    <meta
      name="description"
      content="L’agenda culturel partagé, partout en France : calendrier, carte et favoris."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Armana" />
    <meta property="og:title" content="Armana" />
    <meta
      property="og:description"
      content="L’agenda culturel partagé, partout en France : calendrier, carte et favoris."
    />
    <meta property="og:url" content="https://armana.app" />
    <meta property="og:image" content="https://armana.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Lobster&display=swap"
      rel="stylesheet"
    />
    <!-- Applique le thème AVANT le premier paint (anti-flash). -->
    <script>
      try {
        var t = localStorage.getItem('rezo-theme')
        document.documentElement.dataset.theme = t || 'soleil-or'
      } catch (e) {
        document.documentElement.dataset.theme = 'soleil-or'
      }
    </script>
    <!--
      Pas d'écran d'accueil maison : celui qu'Android génère depuis le manifeste
      (fond jaune + grande icône) est bien plus net. Une version avec le logo
      réduit et le nom écrit en dessous a été essayée puis retirée — le fichier
      masks-logo.png est de trop faible définition, il piquait dès qu'on
      l'agrandissait, et l'enchaînement des deux écrans faisait doublon.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2" />
    <title>Armana</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
